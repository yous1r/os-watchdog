<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>os-watchdog Web Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body {
            margin: 0; padding: 20px;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #eee;
            min-height: 100vh;
        }
        h1 { text-align: center; font-weight: 800; font-size: 2.5rem; letter-spacing: -1px; margin-bottom: 30px; text-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;
            max-width: 1200px; margin: 0 auto;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px; padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.4); }
        .card-header { font-size: 1.2rem; font-weight: 600; margin-bottom: 15px; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .metric-row { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center; }
        .metric-label { color: #aaa; font-size: 0.9rem; }
        .metric-value { font-weight: 600; font-size: 1.1rem; }
        .progress-bar-bg { background: rgba(0,0,0,0.3); border-radius: 8px; height: 10px; width: 100%; overflow: hidden; margin-top: 5px; }
        .progress-bar-fg { background: linear-gradient(90deg, #00C9FF 0%, #92FE9D 100%); height: 100%; width: 0%; transition: width 0.3s ease; }
        .cpu-fg { background: linear-gradient(90deg, #f12711 0%, #f5af19 100%); }
        .mem-fg { background: linear-gradient(90deg, #8E2DE2 0%, #4A00E0 100%); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { color: #aaa; font-weight: 400; }
        .badge { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }
    </style>
</head>
<body>
    <h1>System Dashboard</h1>
    <div class="grid">
        <div class="card">
            <div class="card-header">CPU</div>
            <div class="metric-row"><span class="metric-label">Usage</span><span class="metric-value" id="cpu-val">0%</span></div>
            <div class="progress-bar-bg"><div class="progress-bar-fg cpu-fg" id="cpu-bar"></div></div>
        </div>
        <div class="card">
            <div class="card-header">Memory</div>
            <div class="metric-row"><span class="metric-label">Used / Total</span><span class="metric-value" id="mem-val">0 / 0 MB</span></div>
            <div class="progress-bar-bg"><div class="progress-bar-fg mem-fg" id="mem-bar"></div></div>
        </div>
        <div class="card" style="grid-column: 1 / -1;">
            <div class="card-header">Network Auto-Discovery</div>
            <div style="overflow-x:auto;">
                <table>
                    <thead><tr><th>Interface</th><th>IP Address</th><th>MAC</th><th>RX (B/s)</th><th>TX (B/s)</th></tr></thead>
                    <tbody id="net-tbody"></tbody>
                </table>
            </div>
        </div>
        <div class="card" style="grid-column: 1 / -1;">
            <div class="card-header">Disk I/O</div>
            <div style="overflow-x:auto;">
                <table>
                    <thead><tr><th>Disk</th><th>Mount Point</th><th>Total</th><th>Available</th><th>Read IO (B/s)</th><th>Write IO (B/s)</th></tr></thead>
                    <tbody id="disk-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024; const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function fetchMetrics() {
            try {
                const res = await fetch('/api/metrics');
                const data = await res.json();
                
                document.getElementById('cpu-val').innerText = data.cpu_usage.toFixed(1) + '%';
                document.getElementById('cpu-bar').style.width = data.cpu_usage + '%';
                
                const memTotalMB = (data.mem_total / 1024 / 1024).toFixed(0);
                const memUsedMB = (data.mem_used / 1024 / 1024).toFixed(0);
                document.getElementById('mem-val').innerText = `${memUsedMB} / ${memTotalMB} MB`;
                document.getElementById('mem-bar').style.width = (data.mem_used / data.mem_total * 100) + '%';

                const netTbody = document.getElementById('net-tbody');
                netTbody.innerHTML = '';
                data.networks.forEach(net => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td><span class="badge">${net.interface}</span></td><td>${net.ip}</td><td>${net.mac}</td><td>${formatBytes(net.rx_bytes_per_sec)}/s</td><td>${formatBytes(net.tx_bytes_per_sec)}/s</td>`;
                    netTbody.appendChild(tr);
                });

                const diskTbody = document.getElementById('disk-tbody');
                diskTbody.innerHTML = '';
                data.disks.forEach(disk => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td><span class="badge">${disk.name}</span></td><td>${disk.mount_point || '-'}</td><td>${formatBytes(disk.total_space)}</td><td>${formatBytes(disk.available_space)}</td><td>${formatBytes(disk.read_bytes_per_sec)}/s</td><td>${formatBytes(disk.write_bytes_per_sec)}/s</td>`;
                    diskTbody.appendChild(tr);
                });

            } catch (e) {
                console.error('Failed to fetch metrics', e);
            }
        }

        setInterval(fetchMetrics, 1000);
        fetchMetrics();
    </script>
</body>
</html>
