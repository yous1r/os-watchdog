name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            extension: ''
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            extension: ''
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
            extension: ''
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            extension: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            extension: '.exe'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build with cross
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build with cargo
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary name
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/os-watchdog${{ matrix.extension }} dist/os-watchdog-${{ matrix.target }}${{ matrix.extension }}
          else
            cp target/${{ matrix.target }}/release/os-watchdog dist/os-watchdog-${{ matrix.target }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: os-watchdog-${{ matrix.target }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Archive binaries
        run: |
          mkdir -p release_assets
          for dir in artifacts/*/; do
            target=$(basename "$dir")
            if [[ "$target" == *"windows"* ]]; then
              zip -j "release_assets/${target}.zip" "$dir"/*
            else
              tar -czf "release_assets/${target}.tar.gz" -C "$dir" .
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
